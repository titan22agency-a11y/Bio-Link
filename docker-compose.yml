# Production stack: Postgres + app (+ one-off migrate job).
# Nginx runs on the host (see deploy/nginx) so it can also front other sites
# and hold Let's Encrypt certificates. App listens on 127.0.0.1:3000 only.
#
#   docker compose up -d db
#   docker compose run --rm migrate      # migrations + seed admin
#   docker compose up -d app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  migrate:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Bind-mount so host Nginx can serve /uploads directly from disk.
      - ${HOST_UPLOAD_DIR:-/var/www/linkdeck/uploads}:/data/uploads
      - nextcache:/app/.next/cache
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  nextcache:
