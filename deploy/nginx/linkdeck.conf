# /etc/nginx/sites-available/linkdeck.conf
# Replace ourdomain.com everywhere. Needs a wildcard cert for *.ourdomain.com
# (DNS challenge, see deploy/README.md).

limit_req_zone $binary_remote_addr zone=ld_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ld_form:10m rate=10r/m;

upstream linkdeck_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Shared proxy settings
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# ── HTTP -> HTTPS (+ ACME http-01 for custom domains) ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Root domain + all client subdomains ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ourdomain.com www.ourdomain.com *.ourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/ourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ourdomain.com/privkey.pem;

    include /etc/nginx/snippets/linkdeck-common.conf;
}

# ── Custom client domains ──────────────────────────────────────────────
# One small file per domain is generated by deploy/scripts/add-custom-domain.sh
# into /etc/nginx/linkdeck-domains/.
include /etc/nginx/linkdeck-domains/*.conf;
