# /etc/nginx/snippets/linkdeck-common.conf — shared by every LinkDeck server block.

client_max_body_size 8m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Uploaded images: served straight from disk, never touch Node.
location /uploads/ {
    alias /var/www/linkdeck/uploads/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Hashed Next.js assets.
location /_next/static/ {
    proxy_pass http://linkdeck_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /api/contact {
    limit_req zone=ld_form burst=5 nodelay;
    proxy_pass http://linkdeck_app;
}

location /api/ {
    limit_req zone=ld_api burst=40 nodelay;
    proxy_pass http://linkdeck_app;
}

location / {
    proxy_pass http://linkdeck_app;
}
